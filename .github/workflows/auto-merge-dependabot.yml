name: Auto-merge Dependabot

# Enable auto-merge on Dependabot PRs for patch and minor updates.
# The PR still needs to pass all CI checks before it actually merges.
# Major version bumps are ignored by dependabot.yml and never reach here.
on:
  pull_request:
    types: [opened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge "$PR_NUMBER" --auto --squash \
            || echo "::warning::Could not enable auto-merge (check repo settings)"
